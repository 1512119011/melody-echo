# Netlify 部署配置
# 如果你的站点已有 netlify.toml，请将下面 [build] 之外的内容合并进去

[build]
  # 纯静态站点，根目录即为发布目录
  publish = "."

# Edge Functions 路径映射（也可在函数文件内用 export const config 声明，二选一即可）
[[edge_functions]]
  function = "share"
  path = "/share"

# 音源状态 API 代理：解决浏览器跨域拦截 + 第三方 CORS 代理普遍失效问题
[[edge_functions]]
  function = "source-status"
  path = "/api/source-status"

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
